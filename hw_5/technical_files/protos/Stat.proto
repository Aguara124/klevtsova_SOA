syntax = "proto3";

service StatisticsService {
  rpc GetPostStats(PostIdRequest) returns (PostStatsResponse);
  rpc GetPostViewsDaily(PostIdRequest) returns (DailyStatsResponse);
  rpc GetPostLikesDaily(PostIdRequest) returns (DailyStatsResponse);
  rpc GetPostCommentsDaily(PostIdRequest) returns (DailyStatsResponse);

  rpc GetTopPosts(TopRequest) returns (TopPostsResponse);
  rpc GetTopUsers(TopRequest) returns (TopUsersResponse);
}

message PostIdRequest {
  string post_id = 1;
}

message TopRequest {
  string metric = 1; // "like" | "view" | "comment"
}

message PostStatsResponse {
  int32 views = 1;
  int32 likes = 2;
  int32 comments = 3;
}

message DailyStatsResponse {
  repeated DailyStat stats = 1;
}

message DailyStat {
  string date = 1;
  int32 count = 2;
}

message TopPostsResponse {
  repeated PostStat posts = 1;
}

message TopUsersResponse {
  repeated UserStat users = 1;
}

message PostStat {
  string post_id = 1;
  int32 count = 2;
}

message UserStat {
  string user_id = 1;
  int32 count = 2;
}